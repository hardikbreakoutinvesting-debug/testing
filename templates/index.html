<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CalcAPI — Smart Calculator</title>
    <meta
      name="description"
      content="A beautiful, powerful calculator app built on Flask REST API."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Reset & Base ─────────────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #07080f;
        --surface: rgba(255, 255, 255, 0.04);
        --surface-hover: rgba(255, 255, 255, 0.07);
        --border: rgba(255, 255, 255, 0.08);
        --border-focus: rgba(139, 92, 246, 0.6);
        --text-primary: #f1f0ff;
        --text-secondary: #8b8fa8;
        --text-muted: #4a4d63;
        --accent: #7c3aed;
        --accent-light: #a78bfa;
        --accent-glow: rgba(124, 58, 237, 0.35);
        --success: #10b981;
        --error: #ef4444;
        --add: #6366f1;
        --sub: #ec4899;
        --mul: #f59e0b;
        --div: #14b8a6;
        --pow: #f97316;
        --mod: #8b5cf6;
      }

      html {
        height: 100%;
      }

      body {
        min-height: 100%;
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        overflow-x: hidden;
      }

      /* ── Background Orbs ─────────────────────────────────────────────── */
      .bg-orbs {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }

      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.18;
        animation: drift 18s ease-in-out infinite;
      }

      .orb-1 {
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, #7c3aed, transparent);
        top: -15%;
        left: -10%;
        animation-delay: 0s;
      }

      .orb-2 {
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, #3b82f6, transparent);
        bottom: -10%;
        right: -5%;
        animation-delay: -6s;
      }

      .orb-3 {
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, #ec4899, transparent);
        top: 50%;
        left: 60%;
        animation-delay: -12s;
      }

      @keyframes drift {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(40px, -30px) scale(1.05);
        }
        66% {
          transform: translate(-20px, 20px) scale(0.97);
        }
      }

      /* ── Layout ──────────────────────────────────────────────────────── */
      .page {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 3rem 1.5rem 5rem;
        gap: 2rem;
      }

      /* ── Header ──────────────────────────────────────────────────────── */
      header {
        text-align: center;
        animation: fadeDown 0.7s ease both;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 0.75rem;
      }

      .logo-icon {
        width: 42px;
        height: 42px;
        background: linear-gradient(135deg, #7c3aed, #3b82f6);
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 1.25rem;
        box-shadow: 0 0 24px rgba(124, 58, 237, 0.5);
      }

      .logo-name {
        font-size: 1.6rem;
        font-weight: 800;
        background: linear-gradient(135deg, #a78bfa, #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.5px;
      }

      .tagline {
        font-size: 0.9rem;
        color: var(--text-secondary);
        font-weight: 400;
      }

      /* ── Card ────────────────────────────────────────────────────────── */
      .card {
        width: 100%;
        max-width: 520px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 2rem;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        animation: fadeUp 0.7s ease both;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .card-title {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 1.25rem;
      }

      /* ── Inputs ──────────────────────────────────────────────────────── */
      .input-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .input-group label {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-secondary);
        letter-spacing: 0.04em;
      }

      .input-group input {
        font-family: "JetBrains Mono", monospace;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.75rem 1rem;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        width: 100%;
      }

      .input-group input:focus {
        border-color: var(--border-focus);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
      }

      .input-group input::-webkit-inner-spin-button,
      .input-group input::-webkit-outer-spin-button {
        -webkit-appearance: none;
      }

      /* ── Operations Grid ─────────────────────────────────────────────── */
      .ops-label {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-secondary);
        letter-spacing: 0.04em;
        margin-bottom: 0.6rem;
      }

      .ops-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.6rem;
        margin-bottom: 1.5rem;
      }

      .op-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        padding: 0.7rem 0.5rem;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        cursor: pointer;
        transition: all 0.2s ease;
        color: var(--text-secondary);
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        position: relative;
        overflow: hidden;
      }

      .op-btn .op-symbol {
        font-family: "JetBrains Mono", monospace;
        font-size: 1.1rem;
        font-weight: 600;
        line-height: 1;
      }

      .op-btn:hover {
        transform: translateY(-2px);
        background: var(--surface-hover);
      }

      .op-btn.active {
        color: #fff;
        border-color: transparent;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      .op-btn[data-op="add"].active {
        background: linear-gradient(135deg, #4f46e5, #6366f1);
      }
      .op-btn[data-op="subtract"].active {
        background: linear-gradient(135deg, #be185d, #ec4899);
      }
      .op-btn[data-op="multiply"].active {
        background: linear-gradient(135deg, #d97706, #f59e0b);
      }
      .op-btn[data-op="divide"].active {
        background: linear-gradient(135deg, #0d9488, #14b8a6);
      }
      .op-btn[data-op="power"].active {
        background: linear-gradient(135deg, #ea580c, #f97316);
      }
      .op-btn[data-op="modulo"].active {
        background: linear-gradient(135deg, #7c3aed, #8b5cf6);
      }

      /* ── Calculate Button ────────────────────────────────────────────── */
      .calc-btn {
        width: 100%;
        padding: 0.9rem;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #7c3aed, #3b82f6);
        color: #fff;
        font-family: "Inter", sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 24px rgba(124, 58, 237, 0.4);
        letter-spacing: 0.02em;
      }

      .calc-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(124, 58, 237, 0.55);
      }

      .calc-btn:active {
        transform: translateY(0);
      }

      .calc-btn.loading {
        pointer-events: none;
        opacity: 0.8;
      }

      .calc-btn .btn-text {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        display: none;
      }

      .calc-btn.loading .spinner {
        display: block;
      }

      .calc-btn.loading .btn-label {
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── Result Display ──────────────────────────────────────────────── */
      .result-card {
        width: 100%;
        max-width: 520px;
        animation: fadeUp 0.5s ease both;
        display: none;
      }

      .result-card.visible {
        display: block;
      }

      .result-inner {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 1.75rem 2rem;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .result-header {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 1rem;
      }

      .result-expression {
        font-family: "JetBrains Mono", monospace;
        font-size: 1rem;
        color: var(--text-secondary);
        margin-bottom: 0.5rem;
      }

      .result-value {
        font-family: "JetBrains Mono", monospace;
        font-size: 3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #a78bfa, #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        word-break: break-all;
        animation: numberPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      @keyframes numberPop {
        from {
          transform: scale(0.85);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .result-error {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.9rem;
        color: var(--error);
        font-weight: 500;
      }

      /* ── History ─────────────────────────────────────────────────────── */
      .history-card {
        width: 100%;
        max-width: 520px;
        animation: fadeUp 0.6s ease both;
        display: none;
      }

      .history-card.visible {
        display: block;
      }

      .history-inner {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 1.5rem 2rem;
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }

      .history-title {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .history-clear {
        font-size: 0.72rem;
        color: var(--text-muted);
        cursor: pointer;
        background: none;
        border: none;
        font-family: "Inter", sans-serif;
        transition: color 0.2s;
        padding: 0;
      }

      .history-clear:hover {
        color: var(--error);
      }

      .history-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.6rem 0.9rem;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 10px;
        animation: fadeIn 0.3s ease both;
        cursor: pointer;
        transition: background 0.15s;
      }

      .history-item:hover {
        background: var(--surface-hover);
      }

      .history-expr {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        color: var(--text-secondary);
      }

      .history-result {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--accent-light);
      }

      /* ── Op pill ─────────────────────────────────────────────────────── */
      .op-pill {
        display: inline-block;
        padding: 0.15rem 0.5rem;
        border-radius: 6px;
        font-size: 0.65rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-right: 0.4rem;
        vertical-align: middle;
      }

      .pill-add {
        background: rgba(99, 102, 241, 0.2);
        color: #818cf8;
      }
      .pill-subtract {
        background: rgba(236, 72, 153, 0.2);
        color: #f472b6;
      }
      .pill-multiply {
        background: rgba(245, 158, 11, 0.2);
        color: #fbbf24;
      }
      .pill-divide {
        background: rgba(20, 184, 166, 0.2);
        color: #2dd4bf;
      }
      .pill-power {
        background: rgba(249, 115, 22, 0.2);
        color: #fb923c;
      }
      .pill-modulo {
        background: rgba(139, 92, 246, 0.2);
        color: #a78bfa;
      }

      /* ── Animations ──────────────────────────────────────────────────── */
      @keyframes fadeDown {
        from {
          opacity: 0;
          transform: translateY(-16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* ── Responsive ──────────────────────────────────────────────────── */
      @media (max-width: 480px) {
        .card,
        .result-inner,
        .history-inner {
          padding: 1.5rem;
        }

        .result-value {
          font-size: 2.2rem;
        }

        .ops-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <!-- Background -->
    <div class="bg-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <div class="page">
      <!-- Header -->
      <header>
        <div class="logo">
          <div class="logo-icon">🧮</div>
          <span class="logo-name">CalcAPI</span>
        </div>
        <p class="tagline">Powered by Flask REST API</p>
      </header>

      <!-- Main Calculator Card -->
      <div class="card">
        <p class="card-title">Calculator</p>

        <!-- Inputs -->
        <div class="input-row">
          <div class="input-group">
            <label for="val-a">Value A</label>
            <input
              id="val-a"
              type="number"
              placeholder="0"
              step="any"
              autocomplete="off"
            />
          </div>
          <div class="input-group">
            <label for="val-b">Value B</label>
            <input
              id="val-b"
              type="number"
              placeholder="0"
              step="any"
              autocomplete="off"
            />
          </div>
        </div>

        <!-- Operations -->
        <p class="ops-label">Operation</p>
        <div class="ops-grid" id="ops-grid">
          <button class="op-btn active" data-op="add" id="op-add">
            <span class="op-symbol">+</span>
            Add
          </button>
          <button class="op-btn" data-op="subtract" id="op-subtract">
            <span class="op-symbol">−</span>
            Subtract
          </button>
          <button class="op-btn" data-op="multiply" id="op-multiply">
            <span class="op-symbol">×</span>
            Multiply
          </button>
          <button class="op-btn" data-op="divide" id="op-divide">
            <span class="op-symbol">÷</span>
            Divide
          </button>
          <button class="op-btn" data-op="power" id="op-power">
            <span class="op-symbol">xⁿ</span>
            Power
          </button>
          <button class="op-btn" data-op="modulo" id="op-modulo">
            <span class="op-symbol">%</span>
            Modulo
          </button>
        </div>

        <!-- Calculate Button -->
        <button class="calc-btn" id="calc-btn">
          <span class="btn-text">
            <div class="spinner"></div>
            <span class="btn-label">Calculate</span>
          </span>
        </button>
      </div>

      <!-- Result Card -->
      <div class="result-card" id="result-card">
        <div class="result-inner">
          <p class="result-header">Result</p>
          <div id="result-content"></div>
        </div>
      </div>

      <!-- History Card -->
      <div class="history-card" id="history-card">
        <div class="history-inner">
          <div class="history-header">
            <span class="history-title">History</span>
            <button class="history-clear" id="history-clear">Clear all</button>
          </div>
          <div class="history-list" id="history-list"></div>
        </div>
      </div>
    </div>

    <script>
      const opSymbols = {
        add: "+",
        subtract: "−",
        multiply: "×",
        divide: "÷",
        power: "^",
        modulo: "%",
      };

      let selectedOp = "add";
      let history = [];

      /* ── Operation selector ─────────────────────────────────────────── */
      document.getElementById("ops-grid").addEventListener("click", (e) => {
        const btn = e.target.closest(".op-btn");
        if (!btn) return;
        document
          .querySelectorAll(".op-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        selectedOp = btn.dataset.op;
      });

      /* ── Calculate ──────────────────────────────────────────────────── */
      document.getElementById("calc-btn").addEventListener("click", calculate);

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") calculate();
      });

      async function calculate() {
        const a = parseFloat(document.getElementById("val-a").value);
        const b = parseFloat(document.getElementById("val-b").value);

        if (isNaN(a) || isNaN(b)) {
          showError("Please enter valid numbers for both A and B.");
          return;
        }

        const btn = document.getElementById("calc-btn");
        btn.classList.add("loading");

        try {
          const res = await fetch("/calculate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ operation: selectedOp, a, b }),
          });

          const data = await res.json();

          if (!res.ok) {
            showError(data.error || "An error occurred.");
          } else {
            showResult(data);
            addToHistory(data);
          }
        } catch {
          showError("Network error — could not reach the API.");
        } finally {
          btn.classList.remove("loading");
        }
      }

      /* ── Display result ─────────────────────────────────────────────── */
      function showResult(data) {
        const sym = opSymbols[data.operation] || data.operation;
        const formatted =
          Number.isInteger(data.result)
            ? data.result.toLocaleString()
            : parseFloat(data.result.toFixed(10)).toLocaleString();

        document.getElementById("result-content").innerHTML = `
          <p class="result-expression">${data.a} ${sym} ${data.b} =</p>
          <div class="result-value">${formatted}</div>
        `;

        const card = document.getElementById("result-card");
        card.classList.add("visible");
        // Re-trigger animation
        const val = card.querySelector(".result-value");
        val.style.animation = "none";
        val.offsetHeight;
        val.style.animation = "";
      }

      function showError(msg) {
        document.getElementById("result-content").innerHTML = `
          <div class="result-error">⚠️ ${msg}</div>
        `;
        document.getElementById("result-card").classList.add("visible");
      }

      /* ── History ────────────────────────────────────────────────────── */
      function addToHistory(data) {
        history.unshift(data);
        if (history.length > 8) history.pop();
        renderHistory();
      }

      function renderHistory() {
        const list = document.getElementById("history-list");
        const card = document.getElementById("history-card");

        if (history.length === 0) {
          card.classList.remove("visible");
          return;
        }

        card.classList.add("visible");
        list.innerHTML = history
          .map((item, i) => {
            const sym = opSymbols[item.operation] || item.operation;
            const formatted =
              Number.isInteger(item.result)
                ? item.result.toLocaleString()
                : parseFloat(item.result.toFixed(6)).toLocaleString();
            const pillClass = `pill-${item.operation}`;
            return `
            <div class="history-item" data-index="${i}" role="button" tabindex="0">
              <span class="history-expr">
                <span class="op-pill ${pillClass}">${item.operation}</span>
                ${item.a} ${sym} ${item.b}
              </span>
              <span class="history-result">= ${formatted}</span>
            </div>
          `;
          })
          .join("");

        // Click to restore
        list.querySelectorAll(".history-item").forEach((el) => {
          el.addEventListener("click", () => {
            const item = history[+el.dataset.index];
            document.getElementById("val-a").value = item.a;
            document.getElementById("val-b").value = item.b;
            document
              .querySelectorAll(".op-btn")
              .forEach((b) => b.classList.remove("active"));
            const opBtn = document.querySelector(
              `.op-btn[data-op="${item.operation}"]`
            );
            if (opBtn) opBtn.classList.add("active");
            selectedOp = item.operation;
            showResult(item);
          });
        });
      }

      document.getElementById("history-clear").addEventListener("click", () => {
        history = [];
        renderHistory();
      });
    </script>
  </body>
</html>
