# Apache Virtual Host — Calculator App (inside Docker container)
# Served via mod_wsgi. App lives at /var/www/calculator-app

<VirtualHost *:80>
    ServerName localhost

    # ── mod_wsgi daemon ────────────────────────────────────────────────────
    WSGIDaemonProcess calculator \
        python-home=/usr \
        python-path=/var/www/calculator-app \
        processes=2 \
        threads=5

    WSGIProcessGroup  calculator
    WSGIScriptAlias / /var/www/calculator-app/wsgi.py
    WSGIPassAuthorization On

    # ── App directory permissions ──────────────────────────────────────────
    <Directory /var/www/calculator-app>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ── Static files served directly by Apache ─────────────────────────────
    Alias /static /var/www/calculator-app/static
    <Directory /var/www/calculator-app/static>
        Options -Indexes
        Require all granted
    </Directory>

    # ── Logging ────────────────────────────────────────────────────────────
    ErrorLog  ${APACHE_LOG_DIR}/calculator_error.log
    CustomLog ${APACHE_LOG_DIR}/calculator_access.log combined
</VirtualHost>
