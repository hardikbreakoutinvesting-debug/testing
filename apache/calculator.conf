# Apache Virtual Host — Calculator App
# Location on EC2: /etc/apache2/sites-available/calculator.conf
#
# Setup steps on your EC2 instance (run once):
#
#   sudo apt update && sudo apt install -y apache2 docker.io
#   sudo a2enmod proxy proxy_http headers rewrite
#   sudo cp calculator.conf /etc/apache2/sites-available/calculator.conf
#   sudo a2ensite calculator.conf
#   sudo a2dissite 000-default.conf
#   sudo systemctl reload apache2
#
# Apache acts as a reverse proxy → Docker container (port 9000)

<VirtualHost *:80>
    ServerName your-ec2-domain-or-ip.com
    ServerAlias www.your-ec2-domain-or-ip.com

    # Proxy to Docker container
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:9000/
    ProxyPassReverse / http://127.0.0.1:9000/

    # Forward real client IP to Flask
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-For   "%{REMOTE_ADDR}s"

    # Timeouts
    ProxyTimeout 60

    # Logging
    ErrorLog  ${APACHE_LOG_DIR}/calculator_error.log
    CustomLog ${APACHE_LOG_DIR}/calculator_access.log combined
</VirtualHost>
