name: Security Scan

on:
  # Runs only after Code Quality passes
  workflow_run:
    workflows:
      - "Code Quality"
    types:
      - completed
  schedule:
    # Also run every Monday at 08:00 UTC independently
    - cron: "0 8 * * 1"

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    # On workflow_run: only proceed if Code Quality succeeded
    # On schedule: always run
    if: >
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install safety & bandit
        run: |
          pip install --upgrade pip
          pip install safety bandit

      - name: Run Safety (dependency CVE check)
        run: |
          safety scan --full-report
        continue-on-error: true

      - name: Run Bandit (static security analysis)
        run: |
          bandit -r . \
            --exclude ./.git,./.pytest_cache,./__pycache__ \
            -ll \
            --format txt
        continue-on-error: true

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Run Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
