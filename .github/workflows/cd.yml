name: CD - Build & Deploy to EC2

on:
  # Trigger only after CI tests pass on main
  workflow_run:
    workflows:
      - "Python Application Test"
    types:
      - completed
    branches:
      - main

env:
  DOCKER_IMAGE: learningx12/calculator-app
  APP_DIR: /var/www/calculator-app
  REPO_URL: https://github.com/hardikbreakoutinvesting-debug/testing.git

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to EC2
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # ── 1. Checkout the exact commit that triggered CI ─────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ── 2. Docker Buildx ───────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Login to Docker Hub ─────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 4. Generate image tags ─────────────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # ── 5. Build & push Apache+mod_wsgi image ─────────────────────────
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "✅ Pushed ${{ env.DOCKER_IMAGE }}"
          echo "   Digest: ${{ steps.build.outputs.digest }}"

      # ── 6. Deploy to EC2 ──────────────────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # ── Step A: Install Docker if not present ──────────────────────
            if ! command -v docker &>/dev/null; then
              echo "🐳 Docker not found — installing..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker "$USER"
              echo "✅ Docker installed: $(docker --version)"
            else
              echo "✅ Docker already installed: $(docker --version)"
            fi

            # ── Step B: Clone or update the repository ─────────────────────
            if [ -d "${{ env.APP_DIR }}/.git" ]; then
              echo "🔄 Pulling latest code into ${{ env.APP_DIR }}..."
              cd "${{ env.APP_DIR }}"
              sudo git fetch origin main
              sudo git reset --hard origin/main
            else
              echo "📂 Cloning repository into ${{ env.APP_DIR }}..."
              sudo git clone "${{ env.REPO_URL }}" "${{ env.APP_DIR }}"
            fi

            # Fix ownership so Apache (www-data) inside container can read files
            sudo chown -R 33:33 "${{ env.APP_DIR }}"

            # ── Step C: Pull the latest Apache image from Docker Hub ────────
            echo "📦 Pulling latest image..."
            sudo docker pull ${{ env.DOCKER_IMAGE }}:latest

            # ── Step D: Stop and remove old container (zero-downtime swap) ──
            echo "🛑 Stopping old container (if any)..."
            sudo docker stop calculator-apache 2>/dev/null || true
            sudo docker rm   calculator-apache 2>/dev/null || true

            # ── Step E: Run Apache container with code volume-mounted ────────
            echo "🚀 Starting Apache container..."
            sudo docker run -d \
              --name calculator-apache \
              --restart unless-stopped \
              -p 80:80 \
              -v "${{ env.APP_DIR }}":/var/www/calculator-app:ro \
              ${{ env.DOCKER_IMAGE }}:latest

            # ── Step F: Verify container is healthy ──────────────────────────
            sleep 3
            if sudo docker ps --filter "name=calculator-apache" \
                               --filter "status=running" | grep -q calculator-apache; then
              echo "✅ Container is running!"
            else
              echo "❌ Container failed to start. Logs:"
              sudo docker logs calculator-apache
              exit 1
            fi

            # ── Step G: Cleanup dangling images ──────────────────────────────
            echo "🧹 Pruning dangling images..."
            sudo docker image prune -f

            echo ""
            echo "🎉 Deployment complete!"
            echo "   App: http://${{ secrets.EC2_HOST }}"
