name: CD - Build & Deploy to EC2

on:
  # Trigger only after CI tests pass on main
  workflow_run:
    workflows:
      - "Python Application Test"
    types:
      - completed
    branches:
      - main

env:
  DOCKER_IMAGE: learningx12/calculator-app

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to EC2
    runs-on: ubuntu-latest
    # Only deploy if CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # ── 1. Checkout the exact commit that triggered CI ─────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ── 2. Docker Buildx for multi-platform builds ─────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Login to Docker Hub ─────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 4. Generate image tags ─────────────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # ── 5. Build & push image ──────────────────────────────────────────
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "✅ Pushed ${{ env.DOCKER_IMAGE }} — digest ${{ steps.build.outputs.digest }}"

      # ── 6. Deploy to EC2 via SSH ───────────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "📦 Pulling latest image..."
            docker pull ${{ env.DOCKER_IMAGE }}:latest

            echo "🛑 Stopping old container (if running)..."
            docker stop calculator-app 2>/dev/null || true
            docker rm   calculator-app 2>/dev/null || true

            echo "🚀 Starting new container..."
            docker run -d \
              --name calculator-app \
              --restart unless-stopped \
              -p 9000:9000 \
              ${{ env.DOCKER_IMAGE }}:latest

            echo "🧹 Pruning dangling images..."
            docker image prune -f

            echo "✅ Deployment complete!"
